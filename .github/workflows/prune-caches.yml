name: Prune caches

# Kuota penyimpanan Actions dihitung dari cache, bukan cuma dari artefak. Tanpa
# ini cache Gradle menumpuk tiap commit (~100 MB per key, key memuat hash
# dependensi jadi selalu baru) sampai langkah unggah artefak ditolak dengan
# "Artifact storage quota has been hit" - padahal build-nya sendiri sehat.
#
# Cache yang dihapus selalu bisa dibangun ulang; build berikutnya hanya mengunduh
# dependensinya sekali lagi.
on:
  schedule:
    # 03:00 UTC tiap hari. Repo yang tidak aktif 60 hari kehilangan jadwal ini
    # (aturan GitHub) - jalankan manual lewat workflow_dispatch kalau begitu.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "menghapus cache lebih tua dari $cutoff"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.created_at < \"$cutoff\") | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
              echo "dihapus: $id"
            done
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" \
            --jq '"sisa: \(.active_caches_count) entri, \(.active_caches_size_in_bytes/1048576|floor) MB"'
